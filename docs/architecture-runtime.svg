<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620"
     role="img" aria-labelledby="arch-runtime-title arch-runtime-desc">
  <title id="arch-runtime-title">Office for MSO runtime data flow</title>
  <desc id="arch-runtime-desc">A command travels from the DSH session into a local bridge sidecar, is pulled by the add-in task pane inside Office, and edits the open document through Office.js; the result travels back the same way.</desc>

  <defs>
    <marker id="rt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="rt-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="rt-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- paper -->
  <rect x="0.5" y="0.5" width="679" height="619" rx="12" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- ── zones (painted first) ───────────────────────────────────────────── -->
  <!-- 区域标签直接写字，不铺遮罩：标签在边框内侧，遮罩只会把 zone 填充切出一块浅斑。 -->
  <rect x="32" y="36" width="296" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="48" y="49" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">1 · DSH PROCESS</text>

  <rect x="32" y="180" width="296" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="48" y="193" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">2 · BRIDGE SIDECAR</text>

  <rect x="32" y="324" width="296" height="228" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="48" y="337" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">3 · OFFICE PROCESS</text>

  <!-- ── arrows (before boxes so lines sit behind nodes) ─────────────────── -->
  <!-- spine: command down -->
  <line x1="180" y1="124" x2="180" y2="212" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rt-arrow-link)"/>
  <!-- spine: pull (dashed = the pane polls, it is not a push) -->
  <line x1="180" y1="268" x2="180" y2="360" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rt-arrow)"/>
  <!-- spine: Office.js edits the document (the focal interaction) -->
  <line x1="180" y1="416" x2="180" y2="464" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#rt-arrow-accent)"/>
  <!-- return: result back to the DSH session -->
  <path d="M 304,388 H 512 Q 520,388 520,380 V 104 Q 520,96 512,96 H 304"
        fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rt-arrow)"/>

  <!-- ── arrow labels ────────────────────────────────────────────────────── -->
  <!-- 不铺不透明遮罩：每段文字都横向/纵向让开了自己的线（竖线 x=180，文字 x≥190），
       遮罩只会把 zone 边框和 zone 填充切出一块浅斑。 -->
  <text x="194" y="171" fill="#7a8399" font-size="8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.06em">COMMAND</text>

  <text x="194" y="317" fill="#7a8399" font-size="8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.06em">POLL 1S</text>

  <text x="194" y="443" fill="#7a8399" font-size="8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.06em">OFFICE.JS</text>

  <text x="534" y="245" fill="#7a8399" font-size="8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.06em">RESULT</text>

  <!-- ── node 1 · DSH session ───────────────────────────────────────────── -->
  <rect x="56" y="68" width="248" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="64" y="74" width="30" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="79" y="83" fill="rgba(45,49,66,0.80)" font-size="7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
  <text x="180" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">DSH session</text>
  <text x="180" y="114" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" text-anchor="middle">POST /office/command</text>

  <!-- ── node 2 · bridge sidecar ────────────────────────────────────────── -->
  <rect x="56" y="212" width="248" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="64" y="218" width="30" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="79" y="227" fill="rgba(45,49,66,0.80)" font-size="7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
  <text x="180" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Bridge sidecar</text>
  <text x="180" y="258" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" text-anchor="middle">127.0.0.1 · own origin only</text>

  <!-- ── node 3 · task pane ─────────────────────────────────────────────── -->
  <rect x="56" y="360" width="248" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="64" y="366" width="30" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="79" y="375" fill="rgba(45,49,66,0.80)" font-size="7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
  <text x="180" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Add-in task pane</text>
  <text x="180" y="406" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" text-anchor="middle">polls every 1s · holds the approval gate</text>

  <!-- ── node 4 · the document (focal) ──────────────────────────────────── -->
  <rect x="56" y="464" width="248" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="56" y="464" width="248" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="64" y="470" width="30" height="12" rx="2" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="79" y="479" fill="rgba(235,108,54,0.90)" font-size="7" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">DOC</text>
  <text x="180" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Word / Excel / PowerPoint</text>
  <text x="180" y="510" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" text-anchor="middle">the document you already have open</text>

  <!-- ── legend ─────────────────────────────────────────────────────────── -->
  <line x1="32" y1="584" x2="648" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <line x1="32" y1="597" x2="56" y2="597" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rt-arrow-link)"/>
  <text x="64" y="600" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">HTTP</text>
  <line x1="120" y1="597" x2="144" y2="597" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rt-arrow)"/>
  <text x="152" y="600" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">ASYNC / RETURN</text>
  <line x1="300" y1="597" x2="324" y2="597" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#rt-arrow-accent)"/>
  <text x="332" y="600" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" letter-spacing="0.14em">OFFICE.JS</text>
</svg>
